# Single origin for the dashboard and the API (TRD §9). Terminate TLS in front of this
# (or add a 443 server block with your certificates) for anything beyond a local demo.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Log the path only: the live-stream WebSocket carries its access token in the query string.
log_format ramei_noquery '$remote_addr [$time_local] "$request_method $uri" $status '
                         '$body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log ramei_noquery;
    server_name _;
    server_tokens off;

    # Uploads up to MAX_UPLOAD_MB (default 200 MB)
    client_max_body_size 210m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    # REST + WebSocket live stream
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long-lived live sessions
        proxy_request_buffering off;
    }

    # SPA: hashed assets are immutable, everything else falls back to index.html
    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
