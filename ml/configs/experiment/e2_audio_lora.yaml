# E2 — audio branch: WavLM-Base+ + LoRA (r=8, alpha=16) + attentive stats pooling (TRD §4.1)
name: e2_audio_wavlm_lora
model:
  pretrained: microsoft/wavlm-base-plus
  mode: lora
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  lora_targets: [q_proj, v_proj]
  embed_dim: 768
  head_hidden: 256
  dropout: 0.2
  num_classes: 7
  gradient_checkpointing: false
train:
  epochs: 15
  batch_size: 8
  grad_accum: 2           # effective batch 16 (TRD)
  eval_batch_size: 16
  lr_encoder: 0.0002      # LoRA parameters
  lr_head: 0.001          # layer weights, pooling, projection, head
  weight_decay: 0.01
  warmup_ratio: 0.1
  label_smoothing: 0.1
  max_grad_norm: 1.0
  patience: 4
  num_workers: 2
  augment:
    max_seconds: 6.0
    gain_db: 6.0
    noise_prob: 0.0
    noise_snr_db: [15.0, 35.0]
