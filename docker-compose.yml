# Full RAMEI stack: dashboard + API behind one nginx origin.
#
#   cp .env.example .env            # set JWT_SECRET (required: APP_ENV is production in containers)
#   docker compose up --build       # http://localhost:8080
#   docker compose exec api python -m app.cli create-user --email admin@ramei.local --role admin
#
# The model bundle is mounted read-only from ml/artifacts/bundles (build it with ml/scripts/run_m2.py).
# PostgreSQL is optional: `docker compose --profile postgres up` and set
# DATABASE_URL=postgresql+psycopg://ramei:<password>@postgres:5432/ramei in .env.
# See docs/03-System-Architecture.md §9 and ADR-0008.

name: ramei

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: .env
    environment:
      # These win over .env, whose paths are written for running on the host.
      APP_ENV: ${APP_ENV_CONTAINER:-production}
      CORS_ORIGINS: '["http://localhost:8080"]'
      MODEL_BUNDLE_DIR: /srv/ramei/bundles
      UPLOAD_DIR: /srv/ramei/backend/uploads
    volumes:
      - ./ml/artifacts/bundles:/srv/ramei/bundles:ro
      - apidata:/srv/ramei/data
      - hfcache:/var/cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  apidata:
  hfcache:
  pgdata:
