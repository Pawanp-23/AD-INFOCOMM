# Local development stack.
# Infrastructure services are active now; application services are added as they are built
# (images defined in infra/docker/). See docs/03-System-Architecture.md §9.1.

name: ramei

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./database/seeds/01_dev_seed.sql:/docker-entrypoint-initdb.d/01_dev_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # backend:   FastAPI service        -> infra/docker/backend.Dockerfile   (milestone M3)
  # worker:    Celery analysis worker -> infra/docker/backend.Dockerfile   (milestone M3)
  # frontend:  React + Vite build     -> infra/docker/frontend.Dockerfile  (milestone M3)
  # proxy:     Nginx TLS + WS upgrade -> infra/nginx/                       (milestone M4)

volumes:
  pgdata:
  miniodata:
