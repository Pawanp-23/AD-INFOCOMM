name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install CPU PyTorch and the ML package (backend imports ramei_ml)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e "../ml"
      - run: pip install -e ".[dev,inference]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  ml:
    name: ML — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install system audio libs
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install CPU PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,audio]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend � type-check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npx vite build
